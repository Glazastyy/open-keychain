name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history, so the changelog step can diff against the previous tag

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_signingStoreLocation: ${{ format('{0}/release.keystore', runner.temp) }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :OpenKeychain:assembleRelease --console=plain

      - name: Rename APK with tag
        run: |
          mkdir -p out
          cp OpenKeychain/build/outputs/apk/release/OpenKeychain-release.apk \
             "out/keychain-app-${GITHUB_REF_NAME}.apk"

      - name: Build changelog from commit messages
        run: |
          prev_tag=$(git tag --sort=-creatordate | grep -Fxv "$GITHUB_REF_NAME" | head -n1)
          {
            echo "## Changelog"
            echo
            if [ -n "$prev_tag" ]; then
              git log --no-merges --pretty='format:- %s (%h)' "${prev_tag}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='format:- %s (%h)'
            fi
          } > CHANGELOG_body.md
          cat CHANGELOG_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/keychain-app-${{ github.ref_name }}.apk
          body_path: CHANGELOG_body.md
          generate_release_notes: true

name: CI

on:
  push:
    branches:
      - master
  # Any pull request, whatever it targets. Restricting this to master meant a
  # pull request against a release or feature branch got no CI at all.
  pull_request:

# A new push supersedes whatever was running for the same ref. Android builds
# are long enough that queued-up stale runs are worth cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  BuildAndTest:
    name: Build and Test on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      # One JDK failing should not hide the result of the other.
      fail-fast: false
      matrix:
        # 21 is the floor: the eu.davidea flexible-adapter dependencies ship Java 21
        # class files, and javac cannot read class files newer than itself. The app's
        # own Java language level is still 17 - that is set by compileOptions, not by
        # the JDK the build runs on.
        java_version: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build project
        run: ./gradlew assemble
      # assemble already builds the release variant, so the unit tests only
      # need running once rather than across all three test variants.
      - name: Run tests
        run: ./gradlew :OpenKeychain:testDebugUnitTest
      - name: Archive UnitTest report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: UnitTest-report-jdk${{ matrix.java_version }}
          path: ${{ github.workspace }}/**/build/reports/tests/testDebugUnitTest
      - name: Archive APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk-jdk${{ matrix.java_version }}
          path: OpenKeychain/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

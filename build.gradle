buildscript {
    ext {
        kotlin_version = '2.2.21'
        sqldelight_version = '2.3.2'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // NOTE: Always use fixed version codes not dynamic ones, e.g. 0.7.3 instead of 0.7.+, see README for more information
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "app.cash.sqldelight:gradle-plugin:$sqldelight_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The eu.davidea flexible-adapter artifacts on Maven Central are republications built
// with JDK 21, so their class files are version 65. javac can only read class files up
// to its own version, which means JDK 17 cannot compile against them at all - it fails
// to read the library, aborts before annotation processing, and then reports every
// AutoValue-generated class as missing. Say so plainly instead of leaving that to be
// worked out from a hundred cascading errors.
def requiredJdk = JavaVersion.VERSION_21
if (JavaVersion.current() < requiredJdk) {
    throw new GradleException(
            "This build requires JDK ${requiredJdk} or newer, but is running on ${JavaVersion.current()}.\n" +
            "The eu.davidea flexible-adapter dependencies ship Java 21 class files, which an " +
            "older javac cannot read. Java language level of the app itself is still 17.")
}

// SDK versions and shared dependency versions used by all subprojects
// See http://tools.android.com/tech-docs/new-build-system/tips#TOC-Controlling-Android-properties-of-all-your-modules-from-the-main-project.
ext {
    compileSdkVersion = 36
    minSdkVersion = 23
    targetSdkVersion = 36

    androidxAnnotationVersion = '1.10.0'

    // OpenPGP / crypto stack
    bouncyCastleProvVersion = '1.85.2'
    bouncyCastleUtilVersion = '1.85'
}

// Source files across this project and the vendored Bouncy Castle carry non-ASCII
// characters, so the encoding javac reads them with has to be stated explicitly.
// Left unset, javac uses the platform default, which is UTF-8 only from JDK 18 on
// (JEP 400); on JDK 17 with a POSIX locale it is US-ASCII and the build fails on
// every one of those files.
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Compile every Android module against the same Java language level.
subprojects {
    plugins.withId('com.android.base') {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    plugins.withId('org.jetbrains.kotlin.android') {
        kotlin {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            }
        }
    }
}
